name: Generate Prisma Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate migration
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/world_news
        run: |
          mkdir -p prisma/migrations/20261121000000_init
          npx --yes prisma@6.19.3 migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script --output prisma/migrations/20261121000000_init/migration.sql

      - name: Save migration to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "Add initial Prisma migration"
          git push
